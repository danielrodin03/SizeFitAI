<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitSize AI — Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="logo">FitSize<span>AI</span></div>
      </header>

      <main class="card">
        <div class="card__head">
          <h1>Tell us two things. We'll figure out the rest.</h1>
          <p class="subtitle">
            Your favorite brand, your usual size there, and how you like clothes to fit.
          </p>
        </div>

        <form id="profile-form" novalidate>
          <section class="form-section">
            <div class="field">
              <label for="favorite_brand">Favorite brand</label>
              <input
                id="favorite_brand"
                name="favorite_brand"
                type="text"
                required
                placeholder="e.g. Calzedonia, Nike, Zara"
                autocomplete="organization"
                list="brand-suggestions"
              />
              <datalist id="brand-suggestions">
                <option value="Zara"></option>
                <option value="H&amp;M"></option>
                <option value="ASOS"></option>
                <option value="Nike"></option>
                <option value="Calzedonia"></option>
                <option value="Mango"></option>
                <option value="Uniqlo"></option>
              </datalist>
              <p class="field-hint">Any brand worldwide — type the name you shop most.</p>
            </div>

            <div class="field">
              <label for="brand_size">Your size at that brand</label>
              <select id="brand_size" name="brand_size" required>
                <option value="" disabled selected>Select size</option>
              </select>
            </div>

            <fieldset class="field chip-field">
              <legend>Fit preference</legend>
              <div class="chip-group">
                <label class="chip">
                  <input type="radio" name="fit_preference" value="relaxed" required />
                  <span>Relaxed</span>
                </label>
                <label class="chip">
                  <input type="radio" name="fit_preference" value="fitted" checked />
                  <span>Fitted</span>
                </label>
                <label class="chip">
                  <input type="radio" name="fit_preference" value="oversized" />
                  <span>Oversized</span>
                </label>
              </div>
            </fieldset>
          </section>

          <p id="status" class="status" role="status" aria-live="polite"></p>

          <button type="submit" class="btn-primary" id="submit-btn">
            Save &amp; start shopping
          </button>
        </form>
      </main>

      <footer class="footer">
        <p>API · <code id="api-url"></code></p>
      </footer>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
